name: Quarterly Collaborator Resource Update

on:
  schedule:
    # Runs at 9:15am UTC on the 1st of Jan, Apr, Jul, Oct (staggered — collab second)
    - cron: '15 9 1 1,4,7,10 *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

# All three resource-update workflows share this group so only one runs at a
# time, even when GitHub delays the crons and collapses the 15-minute stagger
# (as on Jul 1 2026). That also keeps their Anthropic calls under the rate limit.
# `queue: max` lets all of them wait their turn in order — with the default
# (`queue: single`) only one run can wait, and a third arrival cancels it.
# `cancel-in-progress: false` means a running job is never killed.
# A queued run still checks out the commit from when it was triggered, so the
# push step rebases onto the latest main before pushing.
concurrency:
  group: musiclaunch-data-writes
  queue: max
  cancel-in-progress: false

jobs:
  update-resources:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run collaborator resource update script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/update-collab-resources.js

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet collaborator-resources.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in collaborator-resources.json"
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add collaborator-resources.json
          git commit -m "Quarterly collaborator resource update — $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push
