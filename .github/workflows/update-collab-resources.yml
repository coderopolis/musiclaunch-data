name: Quarterly Collaborator Resource Update

on:
  schedule:
    # Runs at 9am UTC on the 1st of Jan, Apr, Jul, Oct (every 90 days)
    - cron: '0 9 1 1,4,7,10 *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  update-resources:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run collaborator resource update script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/update-collab-resources.js

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet collaborator-resources.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in collaborator-resources.json"
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add collaborator-resources.json
          git commit -m "Quarterly collaborator resource update — $(date +%Y-%m-%d)"
          git push
