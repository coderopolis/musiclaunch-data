name: Quarterly Influencer Resource Update

on:
  schedule:
    # Runs at 9:30am UTC on the 1st of Jan, Apr, Jul, Oct (staggered — influencer third)
    - cron: '30 9 1 1,4,7,10 *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  update-resources:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run influencer resource update script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/update-influencer-resources.js

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet influencer-resources.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in influencer-resources.json"
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add influencer-resources.json
          git commit -m "Quarterly influencer resource update — $(date +%Y-%m-%d)"
          git push
