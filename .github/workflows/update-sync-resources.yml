name: Quarterly Sync Resource Update

on:
  schedule:
    # Runs at 9:00am UTC on the 1st of Jan, Apr, Jul, Oct (staggered — sync first)
    - cron: '0 9 1 1,4,7,10 *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

# All three resource-update workflows share this group so they're serialized
# rather than racing on `git push`. Without this, manually triggering two
# workflows at the same time causes the second push to fail with
# "Updates were rejected because the remote contains work that you do not have locally."
# `cancel-in-progress: false` means queued runs wait their turn instead of
# being killed when a new run starts.
concurrency:
  group: musiclaunch-data-push
  cancel-in-progress: false

jobs:
  update-resources:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run resource update script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/update-resources.js

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet sync-resources.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in sync-resources.json"
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sync-resources.json
          git commit -m "Quarterly sync resource update — $(date +%Y-%m-%d)"
          git push
